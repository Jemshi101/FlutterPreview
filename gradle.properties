# Android Studio install the plugin is compiled against and run in (./gradlew runIde).
androidStudioPath=/Applications/Android Studio.app

pluginVersion=0.4.0
pluginSinceBuild=262

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true

# Android Studio 2026.2 needs Java 25; use the JBR bundled with it as the Gradle toolchain.
org.gradle.java.installations.paths=/Applications/Android Studio.app/Contents/jbr/Contents/Home
